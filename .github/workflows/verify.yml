name: Calibration verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install pinned secret scanner
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          cd "$RUNNER_TEMP"
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' checksums.txt | sed 's/gitleaks_8.24.3_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan full history and working tree
        run: bash scripts/scan-secrets.sh
      - name: Generate ephemeral credentials outside repository
        run: |
          for variable in DB_PASSWORD MYSQL_ROOT_PASSWORD BROKER_PASSWORD; do
            value=$(openssl rand -hex 24)
            echo "::add-mask::$value"
            echo "$variable=$value" >> "$GITHUB_ENV"
          done
          echo "DB_USER=calibration_app" >> "$GITHUB_ENV"
          echo "BROKER_USER=calibration_app" >> "$GITHUB_ENV"
      - name: Start real MySQL and RabbitMQ
        run: |
          docker compose up -d
          for attempt in $(seq 1 90); do
            if docker compose exec -T database sh -c 'MYSQL_PWD="$MYSQL_PASSWORD" mysql -u "$MYSQL_USER" -D calibration -e "SELECT 1"' >/dev/null 2>&1 && docker compose exec -T broker rabbitmq-diagnostics -q ping; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Build and unit test once
        run: mvn -B verify
      - name: Verify six sources, both profiles, validation and actuator
        env:
          REQUIRE_HEALTH_UP: 'true'
        run: python3 scripts/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibration-evidence
          path: |
            evidence/
            target/surefire-reports/
      - name: Stop dependencies
        if: always()
        run: docker compose down -v
