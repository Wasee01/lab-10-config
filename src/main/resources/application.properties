server.address=${SERVER_ADDRESS:127.0.0.1}
spring.application.name=config-profiles-calibration
spring.profiles.default=local
enrollment.rules.max-waitlist-size=10
enrollment.rules.max-credits=18
enrollment.rules.registration-window-days=14
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/calibration}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=2000
spring.rabbitmq.host=${BROKER_HOST:localhost}
spring.rabbitmq.port=${BROKER_PORT:5672}
spring.rabbitmq.username=${BROKER_USER:}
spring.rabbitmq.password=${BROKER_PASSWORD:}
spring.rabbitmq.connection-timeout=2s
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoint.metrics.access=read-only
management.endpoints.web.exposure.include=health,info,metrics
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
management.health.db.enabled=true
management.health.rabbit.enabled=true
management.info.env.enabled=true
info.app.name=Configuration calibration
