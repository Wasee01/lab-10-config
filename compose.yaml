services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: calibration
      MYSQL_USER: ${DB_USER:?Set DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports: ["127.0.0.1:3306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
  broker:
    image: rabbitmq:4.1
    environment:
      RABBITMQ_DEFAULT_USER: ${BROKER_USER:?Set BROKER_USER}
      RABBITMQ_DEFAULT_PASS: ${BROKER_PASSWORD:?Set BROKER_PASSWORD}
    ports: ["127.0.0.1:5672:5672"]
volumes:
  mysql_data:
